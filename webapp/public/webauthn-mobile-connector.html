<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f3" />
    <meta name="color-scheme" content="light" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Vault WebAuthn Connector</title>
    <style>
      :root {
        color-scheme: light;
        --primary: #2b5a4c;
        --primary-strong: #224a3e;
        --text: #191c1a;
        --muted: #5d655f;
        --line: #dde1dc;
        --panel: #ffffff;
        --surface: #f4f5f3;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--surface);
        color: var(--text);
      }

      main {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: center;
        padding: max(28px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      }

      .connector-card {
        width: min(100%, 430px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 1px 0 rgba(25, 28, 26, 0.03);
        padding: 28px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 24px;
      }

      .brand-mark {
        display: inline-grid;
        width: 26px;
        height: 26px;
        place-items: center;
        border-radius: 5px;
        background: var(--primary);
        color: #fff;
      }

      .brand-mark svg {
        width: 16px;
        height: 16px;
      }

      .brand strong {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 23px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
      }

      .form {
        display: grid;
        gap: 16px;
        margin-top: 24px;
      }

      button {
        min-height: 48px;
        width: 100%;
        border: 1px solid var(--primary);
        border-radius: 6px;
        background: var(--primary);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        transition: background-color 160ms ease, border-color 160ms ease;
      }

      button:hover:not(:disabled)[aria-disabled="false"] {
        background: var(--primary-strong);
        border-color: var(--primary-strong);
      }

      button:active:not(:disabled)[aria-disabled="false"] {
        transform: none;
      }

      button:disabled,
      button[aria-disabled="true"] {
        cursor: not-allowed;
        opacity: 0.62;
      }

      button[data-state="return"] {
        cursor: pointer;
        opacity: 1;
      }

      .msg {
        display: none;
        border-radius: 6px;
        padding: 11px 12px;
        font-size: 14px;
        line-height: 1.45;
      }

      .msg.show {
        display: block;
      }

      .msg.info {
        border: 1px solid color-mix(in srgb, #2b5a4c 26%, #dde1dc);
        background: #f1f5f2;
        color: #1b3b31;
      }

      .msg.error {
        border: 1px solid #fecaca;
        background: #fef2f2;
        color: #991b1b;
      }

      .msg.success {
        border: 1px solid #bbf7d0;
        background: #f0fdf4;
        color: #166534;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="connector-card" aria-labelledby="webauthn-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="3.25" />
              <path d="M12 11.25V21" />
              <path d="M12 16.5h2.75" />
            </svg>
          </span>
          <strong>Vault</strong>
        </div>
        <h1 id="webauthn-header">Verify your identity</h1>
        <p id="webauthn-copy">Use your security key to finish two-step verification.</p>
        <div class="form">
          <div id="webauthn-status" class="msg" role="status" aria-live="polite" hidden></div>
          <button id="webauthn-button" type="button" data-state="loading" aria-busy="true" aria-disabled="true">
            Preparing passkey…
          </button>
        </div>
      </section>
    </main>
    <script type="module" src="/webauthn-mobile-connector.js"></script>
  </body>
</html>
