<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    connect-src 'self' https://api.pwnedpasswords.com;
    font-src 'self';
    object-src 'none';
    form-action 'self';
    base-uri 'self';
  " />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f4f5f3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vault" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>Vault</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #f4f5f3;
        color: #191c1a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      .boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      .boot-card {
        width: min(360px, 100%);
        display: grid;
        gap: 16px;
        justify-items: center;
        padding: 28px;
        border: 1px solid #dde1dc;
        border-radius: 8px;
        background: #ffffff;
      }

      .boot-title {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .boot-line {
        width: 100%;
        height: 3px;
        border-radius: 2px;
        background: #e8ebe6;
        overflow: hidden;
      }

      .boot-line::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: #2b5a4c;
        animation: boot-slide 1.1s ease-in-out infinite;
      }

      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-line::after { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <div class="boot-card" aria-label="Loading Vault">
          <div class="boot-title">Vault</div>
          <div class="boot-line"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
